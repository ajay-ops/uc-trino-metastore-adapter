apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uc-trino-metastore-adapter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uc-trino-metastore-adapter
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trino
      ports:
        - protocol: TCP
          port: 9083
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
