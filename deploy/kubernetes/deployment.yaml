apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc-trino-metastore-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uc-trino-metastore-adapter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uc-trino-metastore-adapter
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          # Build, push and replace with your registry/image digest before applying.
          image: uc-trino-metastore-adapter:replace-by-deploy-script
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: uc-trino-metastore-adapter
            - configMapRef:
                name: uc-trino-metastore-environment
          env:
            - name: UC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: uc-adapter-token
                  key: UC_TOKEN
          ports:
            - name: thrift
              containerPort: 9083
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
